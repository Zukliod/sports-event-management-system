version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    volumes:
      - ..:/workspace:cached
    depends_on:
      - db
      - redis
    command: sleep infinity

  db:
    image: postgres:18-alpine # ✅ Matches your local PostgreSQL 18 choice
    restart: always
    environment:
      POSTGRES_USER: sems_admin
      POSTGRES_PASSWORD: sems_secure_password
      POSTGRES_DB: sems_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine # ✅ Docker handles this entirely, no local install needed!
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
